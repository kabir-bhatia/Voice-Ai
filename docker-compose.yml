# Step 3 — FULLY self-hosted: Whisper STT + Qwen LLM (vLLM) + Kokoro TTS. No Google.
# All three servers are OpenAI-compatible and bound to localhost.  VM: NVIDIA L4 24GB.
#   Start:  docker compose up -d
#   Logs:   docker compose logs -f vllm   (first start downloads the LLM weights ~6GB)
#   Stop:   docker compose down
#
# VRAM budget on the 23GB L4 (approx):
#   vLLM (Qwen2.5-7B AWQ + KV) ~12GB | whisper turbo ~2-3GB | kokoro ~1.5GB  -> fits.

services:
  # ---- LLM: vLLM serving Qwen2.5-7B (AWQ 4-bit), OpenAI /v1 on :8000 ----
  vllm:
    image: vllm/vllm-openai:latest
    command: >
      --model Qwen/Qwen2.5-7B-Instruct-AWQ
      --quantization awq_marlin
      --max-model-len 8192
      --gpu-memory-utilization 0.55
      --enable-prefix-caching
      --served-model-name qwen2.5-7b
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ---- STT: faster-whisper, OpenAI /v1/audio/transcriptions on :8001 ----
  # Upgraded small -> large-v3-turbo: much better accuracy, still low latency on the L4.
  # Alternatives (just change WHISPER__MODEL here + STT_MODEL in .env.local):
  #   distil-whisper (fastest whisper-family): Systran/faster-distil-whisper-large-v3
  #   max accuracy:                            Systran/faster-whisper-large-v3
  #   best-in-class (separate NeMo server, not this image): NVIDIA Parakeet TDT
  whisper:
    image: fedirz/faster-whisper-server:latest-cuda
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    environment:
      - WHISPER__MODEL=deepdml/faster-whisper-large-v3-turbo-ct2
      - WHISPER__INFERENCE_DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # ---- TTS: Kokoro-FastAPI, OpenAI /v1/audio/speech on :8002 ----
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    ports:
      - "127.0.0.1:8002:8880"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  hf-cache:
